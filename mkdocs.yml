site_name: Logical UI Design
site_description: 認知心理学と人間工学からUIデザインを学ぶ教材
repo_name: logical-ui-design
repo_url: https://github.com/Moto1829/logical-ui-design
site_url: https://Moto1829.github.io/logical-ui-design/
theme:
  name: material
  custom_dir: docs/overrides
  language: ja
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - tables
  - toc:
      permalink: true
plugins:
  - search
extra:
  analytics:
    provider: google
    property: G-30CNQ76VER
extra_css:
  - stylesheets/extra.css
docs_dir: docs
site_dir: site
use_directory_urls: false
nav:
  - ホーム: index.md
  - 基礎:
      - 第1章 UI設計の基礎: 01-foundations.md
      - 第2章 人はどう画面を認知するか: 02-perception-and-cognition.md
      - 第3章 情報設計とレイアウト: 03-information-architecture-and-layout.md
  - 主要UI:
      - 第4章 フォームと入力UI: 04-forms-and-inputs.md
      - 第5章 状態変化とフィードバック: 05-feedback-and-response.md
      - 第6章 アクセシビリティとインクルーシブデザイン: 06-accessibility-and-inclusive-design.md
      - 第7章 UIレビューの観点: 07-ui-review-checklist.md
  - 応用テーマ:
      - 第8章 ダッシュボードの情報優先順位: 08-dashboard-prioritization.md
      - 第9章 テーブルとカードの使い分け: 09-table-vs-card.md
      - 第10章 空状態と初回状態の設計: 10-empty-states.md
      - 第11章 エラー、権限不足、タイムアウトの設計: 11-error-permissions-timeouts.md
      - 第12章 オンボーディングと段階的開示: 12-onboarding-and-progressive-disclosure.md
      - 第13章 危険操作と安全設計: 13-dangerous-actions.md
      - 第14章 モバイルUIとタッチ操作: 14-mobile-ui-ergonomics.md
      - 第15章 アクセシビリティ実践編: 15-accessibility-in-practice.md
      - 第16章 UI文言設計: 16-ui-copywriting.md
      - 第17章 UIレビューのケーススタディ: 17-review-case-study.md
  - UI部品とナビゲーション:
      - 第18章 ボタンとアクションの設計: 18-buttons-and-actions.md
      - 第19章 モーダルと割り込みの設計: 19-modals-and-interruption.md
      - 第20章 検索とフィルタの設計: 20-search-and-filters.md
      - 第21章 ナビゲーションと画面遷移: 21-navigation-and-wayfinding.md
  - 操作の流れと信頼:
      - 第22章 待ち時間と読み込みの設計: 22-loading-and-waiting.md
      - 第23章 一覧の操作設計: 23-list-operations.md
      - 第24章 複数ステップの入力設計: 24-multi-step-forms.md
      - 第25章 通知とメッセージの階層: 25-notifications-and-messages.md
      - 第26章 ダークパターンと倫理的なUI: 26-dark-patterns-and-ethics.md
  - 発展テーマ:
      - 第27章 AI機能のUI設計: 27-ai-features.md
      - 第28章 設定画面の設計: 28-settings-screens.md
      - 第29章 一貫性とデザインシステム: 29-consistency-and-design-systems.md
      - 第30章 データ可視化の基礎: 30-data-visualization.md
      - 第31章 日付、時刻、数値の入力: 31-date-time-number-input.md
      - 第32章 モーションとアニメーション: 32-motion-and-animation.md
  - 補助資料:
      - UIレビュー用テンプレート: review-template.md
      - 原則と用語の索引: glossary.md
      - アンチパターン集: anti-patterns.md
      - ユーザビリティテストの簡易手順: usability-testing.md
      - サンプル一覧: samples/index.md